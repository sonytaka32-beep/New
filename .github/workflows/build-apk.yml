name: Build Shisui Calc 3 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build-android:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (cmdline-tools)
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest"

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Create Cordova project and build
        run: |
          # Create a fresh Cordova project
          cordova create build com.sonytaka32.shisuicalc "Shisui Calc"
          cd build
          # Copy our www files
          cp ../index.html www/
          cp -r ../css www/
          cp -r ../js www/
          cp -r ../assets www/
          # Copy config.xml (will override the default one)
          cp ../config.xml .
          # Add Android platform and build
          cordova platform add android@13.0.0
          cordova build android --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shisui-calc-v3-debug-apk
          path: build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error